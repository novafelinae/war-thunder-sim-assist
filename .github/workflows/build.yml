name: Build Windows release

# Elle başlatmak için: GitHub'da Actions → "Build Windows release" → Run workflow.
# Yayın (Release) oluşturmak için: v ile başlayan bir etiket gönder, örn. v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Release'e dosya yüklemek için

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürümü belirle
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^[vV]\.?', ''
          } else {
            $v = "0.0.0-dev"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Koddaki sürüm etiketle uyuşuyor mu?
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $m = Select-String -Path src/warthunder_sim_assist.py -Pattern '^SURUM = "(.+)"' | Select-Object -First 1
          $app = $m.Matches[0].Groups[1].Value
          $taban = $env:APP_VERSION.Split("-")[0]   # v1.0.0-alpha -> 1.0.0
          if ($app -ne $taban) {
            throw "Sürüm uyuşmuyor: kodda SURUM=$app, etiketin sürüm kısmı=$taban (etiket=$env:APP_VERSION)"
          }

      - name: Kodu denetle
        run: python -m py_compile src/warthunder_sim_assist.py

      - name: PyInstaller kur
        run: python -m pip install "pyinstaller>=6,<7"

      - name: Exe derle
        run: pyinstaller --noconfirm --clean --windowed --name WarThunderSimAssist --icon assets/icon.ico src/warthunder_sim_assist.py

      - name: Exe oluştu mu?
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WarThunderSimAssist/WarThunderSimAssist.exe")) {
            throw "WarThunderSimAssist.exe üretilemedi"
          }

      - name: Taşınabilir zip
        shell: pwsh
        run: Compress-Archive -Path "dist/WarThunderSimAssist" -DestinationPath "WarThunderSimAssist-portable-$env:APP_VERSION.zip"

      - name: Inno Setup kur
        run: choco install innosetup -y --no-progress

      - name: Kurulum dosyasını derle
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "installer\installer.iss"

      - name: Dosyaları yükle (Actions çıktısı)
        uses: actions/upload-artifact@v4
        with:
          name: WarThunderSimAssist-${{ env.APP_VERSION }}
          path: |
            WarThunderSimAssist-portable-*.zip
            dist-installer/*.exe

      - name: GitHub Release oluştur
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WarThunderSimAssist-portable-*.zip
            dist-installer/*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
